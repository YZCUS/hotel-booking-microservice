server:
  port: 8084

spring:
  application:
    name: search-service
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    connection-timeout: 30000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

meilisearch:
  host: ${MEILISEARCH_HOST:http://localhost:7700}
  api-key: ${MEILISEARCH_API_KEY}

services:
  hotel-service:
    url: ${HOTEL_SERVICE_URL:http://hotel-service:8082}

app:
  internal:
    service-name: search-service
    service-secret: ${INTERNAL_SERVICE_SECRET:secure-shared-secret-change-in-production}
    service-header: X-Internal-Service
    token-header: X-Internal-Token

management:
  server:
    port: 9004
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        application:
          include: "*"
          additional-path: "server:/healthz"
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.hotel.search: DEBUG
    org.springframework.amqp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/search-service.log

search:
  default-limit: 20
  max-limit: 100
  timeout-ms: 5000
