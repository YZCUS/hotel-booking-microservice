global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:9000']

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:9001']

  - job_name: hotel-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['hotel-service:9002']

  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['booking-service:9003']

  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['search-service:9004']

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:9005']

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: meilisearch
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/meilisearch-metrics-key
    static_configs:
      - targets: ['meilisearch:7700']

  - job_name: frontend
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: alertmanager
    metrics_path: /metrics
    static_configs:
      - targets: ['alertmanager:9093']
