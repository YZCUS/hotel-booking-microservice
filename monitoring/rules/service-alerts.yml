groups:
  - name: hotel-platform
    rules:
      # Gateway server observations use uri=UNKNOWN for routed requests. Route
      # metrics let us exclude health routes without tagging arbitrary paths.
      - record: hotel:http_requests:rate2m
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job!="api-gateway",uri!~"/actuator.*|/healthz|/health/.*"}[2m]))
          or
          sum by (job) (rate(spring_cloud_gateway_requests_seconds_count{job="api-gateway",routeId!~".*-health"}[2m]))

      - record: hotel:http_errors:rate2m
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job!="api-gateway",status=~"5..",uri!~"/actuator.*|/healthz|/health/.*"}[2m]))
          or
          sum by (job) (rate(spring_cloud_gateway_requests_seconds_count{job="api-gateway",httpStatusCode=~"5..",routeId!~".*-health"}[2m]))

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} metrics endpoint is unreachable'
          description: 'Scraping has failed for one minute. Check the container, network and metrics endpoint.'

      - alert: BackendUnavailable
        expr: pg_up == 0 or redis_up == 0 or nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} backend is unavailable'
          description: 'The exporter is reachable but cannot reach its backend. Check backend health and credentials.'

      - alert: HighHttpErrorRate
        expr: |
          (hotel:http_errors:rate2m / hotel:http_requests:rate2m) > 0.05
          and on (job) hotel:http_requests:rate2m > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} HTTP 5xx rate is above 5%'
          description: 'The two-minute 5xx ratio exceeded 5% for one minute, with more than six requests per minute. Health checks are excluded.'
