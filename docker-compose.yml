version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hotel-postgres
    environment:
      POSTGRES_DB: hotel_reservation
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_MULTIPLE_DATABASES: hotel_reservation,hotel_test
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_reservation"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    command: redis-server --appendonly yes --requirepass hotel_redis_pass
    volumes:
      - redis_data:/data
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "hotel_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hotel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hotel_user
      RABBITMQ_DEFAULT_PASS: hotel_pass
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: hotel-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: true
      MEILI_MASTER_KEY: masterKey123456789
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_EXPERIMENTAL_ENABLE_METRICS: true
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # User Service
  user-service:
    build: 
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: hotel-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_reservation
      SPRING_DATASOURCE_USERNAME: hotel_user
      SPRING_DATASOURCE_PASSWORD: hotel_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: hotel_redis_pass
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: hotel_user
      SPRING_RABBITMQ_PASSWORD: hotel_pass
      JWT_SECRET: ${JWT_SECRET:-myVerySecureSecretKey123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secure-shared-secret-change-in-production}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: user_svc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Hotel Service
  hotel-service:
    build: 
      context: ./services/hotel-service
      dockerfile: Dockerfile
    container_name: hotel-hotel-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_reservation
      SPRING_DATASOURCE_USERNAME: hotel_user
      SPRING_DATASOURCE_PASSWORD: hotel_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: hotel_redis_pass
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: hotel_user
      SPRING_RABBITMQ_PASSWORD: hotel_pass
      BOOKING_SERVICE_URL: http://booking-service:8083
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secure-shared-secret-change-in-production}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: hotel_svc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Booking Service
  booking-service:
    build: 
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: hotel-booking-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_reservation
      SPRING_DATASOURCE_USERNAME: hotel_user
      SPRING_DATASOURCE_PASSWORD: hotel_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: hotel_redis_pass
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: hotel_user
      SPRING_RABBITMQ_PASSWORD: hotel_pass
      HOTEL_SERVICE_URL: http://hotel-service:8082
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secure-shared-secret-change-in-production}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: booking_svc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Search Service
  search-service:
    build: 
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: hotel-search-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: masterKey123456789
      HOTEL_SERVICE_URL: http://hotel-service:8082
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: hotel_user
      SPRING_RABBITMQ_PASSWORD: hotel_pass
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secure-shared-secret-change-in-production}
    depends_on:
      meilisearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Notification Service
  notification-service:
    build: 
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: hotel-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: hotel_user
      SPRING_RABBITMQ_PASSWORD: hotel_pass
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      SPRING_MAIL_FROM: ${MAIL_FROM:-noreply@hotel.com}
      USER_SERVICE_URL: http://user-service:8081
      HOTEL_SERVICE_URL: http://hotel-service:8082
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secure-shared-secret-change-in-production}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # API Gateway
  api-gateway:
    build: 
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: hotel-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: hotel_redis_pass
      JWT_SECRET: ${JWT_SECRET:-myVerySecureSecretKey123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secure-shared-secret-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://frontend:3000}
      USER_SERVICE_URL: http://user-service:8081
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      SEARCH_SERVICE_URL: http://search-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Demo Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: hotel-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped

  # Monitoring & Management
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: hotel-prometheus
    environment:
      MEILISEARCH_METRICS_KEY: ${MEILISEARCH_METRICS_KEY:-masterKey123456789}
    entrypoint:
      - /bin/sh
      - -ec
      - 'umask 077; printf "%s" "$$MEILISEARCH_METRICS_KEY" > /tmp/meilisearch-metrics-key; exec /bin/prometheus "$$@"'
      - --
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - hotel-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    container_name: hotel-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_METRICS_ENABLED: true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - hotel-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/hotel_reservation?sslmode=disable
      DATA_SOURCE_USER: hotel_user
      DATA_SOURCE_PASS: hotel_password
    networks: [hotel-network]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.97.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: hotel_redis_pass
    networks: [hotel-network]
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: ['--nginx.scrape-uri=http://frontend:8086/stub_status']
    networks: [hotel-network]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.0
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager', '--cluster.listen-address=']
    networks: [hotel-network]
    restart: unless-stopped

networks:
  hotel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  meilisearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
